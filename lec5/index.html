<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS_Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>This is a CSS selector tutorial</h1>

    <!-- class selectors -->
    <h2 class="orange">Tangiro</h2>
    <h2 class="yellow">Zenitsu</h2>
    <h2 class="blue">Inoske</h2>

    <!-- id selectors -->
     <h3 id="flame">Flame</h3>
     <h3 id="water">Water</h3>
     <h3 id="love">Love</h3>

     <!-- child selector -->
      <div>
        <p>This para is a child of div</p>
      </div>
      <span>
        <p>This para is a child of div</p>
      </span>
    
    <!-- descendent selector -->
     <div>
        <main>
            <h4>Hello i am a descendent of div and a child of main.....</h4>
        </main>
     </div>
    <!-- Pseudo Selectors -->
     <a href="https://www.google.com" target="_blank">Go to Google</a>
</body>
</html>
