<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>Demon Slayer Recruitment Form</h1>
    <form>
        <div>
            <label for="username">Name:</label>
            <input type="text" id="username" name="username" placeholder="Shinobu">
        </div>
        
        <div>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" placeholder="19">
        </div>
        <div>
            <label for="male">Male</label>
            <input type="radio" id="male" name="gender" value="male">
            
            <label for="female">Female</label>
            <input type="radio" id="female" name="gender" value="female">
        </div>
        <div>
            <p>Enter Your Breathing Style</p>
            <select>
                <option>Water</option>
                <option>Flame</option>
                <option>Wind</option>
                <option>Stone</option>
                <option>Insect</option>
            </select>
        </div>
        <div>
            <input type="checkbox">
            <label>I agree to the Terms of conditions</label>
            <input type="checkbox">
            <label>I am willingfully risking my life for he good cause of humanity</label>
        </div>
        <button>Submit Form</button>
    </form>
    
</body>
</html>
