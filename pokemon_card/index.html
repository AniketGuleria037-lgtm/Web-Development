<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pikachu Card</title>
</head>

<body>
    <div class="card">
        <div class="info">
            <div class="name">
                <p>Name: Pikachu</p>
            </div>
            <div class="level">
                <p>Level: 60</p>
            </div>
        </div>
        <div class="pokemon">
        </div>
        <div class="atks">
            <dl>
                <dt><h3>ThunderBolt</h3></dt>
                <dd>The powerful bolt of shock which may leave the foe paralyzed.</dd>
                <dt><h3>Volt Tackle</h3></dt>
                <dd>A high voltage thrust which inflicts stunning damage to the opponent. The user also gets recoil
                    forec based on the damage dealt</dd>
            </dl>
        </div>
    </div>
</body>

</html>
